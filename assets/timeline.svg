<svg xmlns="http://www.w3.org/2000/svg" width="840" height="763" viewBox="0 0 840 763" role="img" aria-labelledby="heading details"><title id="heading">Experience and education</title><desc id="details">Jan 2026 to Present. Student AI/ML Engineer, Abysalto. I built tools that let a LangGraph agent check each shipment in an order. In Arize Phoenix, I followed OpenTelemetry traces from the tool result to the reply a shopper received. I built the FastAPI service our team uses to publish support answers. The chatbot retrieves those answers from PostgreSQL with pgvector. Oct 2025 to Jul 2027 (expected). Master of Science in Computing, University of Zagreb · FER. Computer Science track Sep 2025 to Jan 2026. Erasmus+ exchange semester, Polytech Tours · Université de Tours. I fine-tuned YOLO11 to outline individual crystals across 15 classes in microscopy images from CHU Orléans. In separate projects, I compared OpenCV edge detectors and tested a linear SVM and BERT on the same 165 medical notes. Jul 2025 to Sep 2025. AI Engineering Intern, Abysalto AI Academy. I wrote the FastAPI routes for configuring agents. I connected Agent Studio to RAG Studio so a LangGraph agent could search the document collections a user selected. Oct 2021 to Jul 2025. Bachelor of Science in Computing, University of Zagreb · FER. For my thesis, I trained a convolutional neural network in Keras to classify seven facial expressions. It correctly classified 934 of 1,432 FER2013 validation images.</desc>
